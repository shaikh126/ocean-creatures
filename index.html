<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0077b6">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>Yusra's Diorama · Sea Creatures · Teacher: Ms. Wendy</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",system-ui,sans-serif;touch-action:manipulation}
#sea{position:fixed;inset:0;background:linear-gradient(#48cae4 0%,#0096c7 30%,#0077b6 60%,#023e8a 100%);overflow:hidden}
.ray{position:absolute;top:-10%;width:12%;height:90%;background:linear-gradient(rgba(255,255,255,.35),transparent);transform-origin:top;filter:blur(6px);animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{transform:rotate(-12deg);opacity:.4}to{transform:rotate(10deg);opacity:.8}}
#sand{position:absolute;bottom:0;left:0;right:0;height:13%;background:radial-gradient(circle at 20% 30%,#fff3 2px,transparent 3px) 0 0/30px 30px,linear-gradient(#f6d58e,#e9b96e);border-radius:50% 50% 0 0/30% 30% 0 0}
.weed{position:absolute;bottom:8%;transform-origin:bottom center;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(20px)}}
.cr{position:absolute;left:0;top:0;cursor:pointer;will-change:transform}
.cr svg,.cr .face{display:block;width:100%;height:100%;pointer-events:none}
.cr.hl{filter:drop-shadow(0 0 12px #ff0) drop-shadow(0 0 22px #ff0)}
.selfie .face{border-radius:50%;border:5px solid #caf0f8;box-shadow:0 0 0 3px #0096c7,inset 0 0 18px #fff8;background-size:cover;background-position:center}
.selfie .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#fff;color:#023e8a;border-radius:12px;padding:2px 10px;font-size:16px;white-space:nowrap;margin-top:4px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(2,62,138,.8);z-index:10;padding-right:96px;transform:translateY(110%);transition:transform .35s ease;border-radius:24px 24px 0 0}
#bar.open{transform:none}
#menub{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:12;width:72px;height:72px;min-height:72px;padding:0;border-radius:50%;font-size:30px;line-height:1;background:#ff70a6;color:#fff;box-shadow:0 4px 0 #c94d7d,0 0 0 4px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center}#menub span{font-size:13px}
button,select{font:inherit;font-size:20px;min-height:56px;padding:8px 18px;border:none;border-radius:28px;background:#ffd60a;color:#023e8a;box-shadow:0 4px 0 #c9a400;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a400}
select{background:#fff;box-shadow:0 4px 0 #90e0ef}
#swim{background:#ff70a6;color:#fff;box-shadow:0 4px 0 #c94d7d;font-size:24px}
.ov{position:fixed;inset:0;background:rgba(0,30,60,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.card{background:#fff;border-radius:30px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px;color:#023e8a;border:8px solid #90e0ef;text-align:center}
.card h2{font-size:40px;margin:4px 0}.card .art{width:180px;height:130px;margin:auto}
.card ul{text-align:left;font-size:21px;line-height:1.4;padding-left:26px}.card p{font-size:21px;text-align:left;margin:8px 0}
.card button{margin:8px}
video,#prev{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:50%;transform:scaleX(-1);border:6px solid #90e0ef;background:#000}
#prev{transform:none}
input{font:inherit;font-size:22px;padding:10px 16px;border-radius:20px;border:3px solid #90e0ef;width:80%;max-width:360px;margin:8px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#023e8a;padding:12px 24px;border-radius:24px;font-size:20px;z-index:30;display:none}
#title{position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;z-index:5;pointer-events:none;text-shadow:0 3px 0 #023e8a,0 0 18px rgba(0,40,90,.8)}
.t1{font-size:clamp(30px,6vw,58px);font-weight:bold}.t2{font-size:clamp(18px,3vw,28px);color:#caf0f8}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px}.opts button{background:#e0f7ff;box-shadow:0 4px 0 #90e0ef}.opts button.on{background:#ff70a6;color:#fff}
.sw{width:52px;height:52px;min-height:52px;padding:0;border-radius:50%;border:4px solid #fff}.sw.on{border-color:#023e8a;transform:scale(1.15)}
.mer svg{position:absolute;inset:0}.mer .face{position:absolute;left:24%;top:7.5%;width:52%;height:32.5%;border:4px solid #ffd60a;box-shadow:none}
.mer .tail{animation:swish 1.1s ease-in-out infinite alternate}.mer .arm{animation:wave 1.6s ease-in-out infinite alternate}
@keyframes swish{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
#tchr{position:fixed;top:8px;right:8px;z-index:11;opacity:.35;min-height:44px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.tile{background:#e0f7ff;box-shadow:0 4px 0 #90e0ef;border-radius:20px;padding:8px;font-size:16px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile.on{background:#ffd60a;box-shadow:0 4px 0 #c9a400}.tile .ta{width:80px;height:60px;display:flex;align-items:center;justify-content:center}.tile .ta svg,.tile .ta img{max-width:100%;max-height:100%;border-radius:10px}
.avt .body{position:absolute;inset:0}.avt .body svg{width:100%;height:100%;overflow:visible}.avt .face{position:absolute;border-radius:50%;border:4px solid #ffd60a;background-size:cover;background-position:center;box-shadow:none}
.avt .face.bubble{border-color:#caf0f8;box-shadow:inset 0 0 10px #fff8}
.avt .tl{animation:swish 1s ease-in-out infinite alternate}@keyframes swish{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.card .thumb{max-width:260px;max-height:200px;border-radius:20px;border:5px solid #90e0ef}.credit{font-size:16px!important;text-align:center!important}
.rbox input{width:62%}.rbox p{text-align:center;font-size:19px;min-height:1em}
.trash,.fx{position:absolute;left:0;top:0;cursor:pointer;z-index:3;will-change:transform}.fx{z-index:4}
.trash.micro svg{animation:twinkle 1.2s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:.5;filter:none}to{opacity:1;filter:drop-shadow(0 0 4px #fff)}}
.trash.bagw svg{animation:bagp 2s ease-in-out infinite alternate;transform-origin:50% 20%}@keyframes bagp{from{transform:scaleY(.9)}to{transform:scaleY(1.08)}}
.oil{position:absolute;z-index:3;cursor:pointer;transform-origin:50% 0;transition:opacity .3s}.drip{animation:drip 2.2s ease-in infinite}@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
.spark{position:absolute;z-index:20;font-size:24px;pointer-events:none;animation:spk .9s ease-out forwards}@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#yay{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:25;background:#fff;color:#023e8a;border:8px solid #06d6a0;border-radius:30px;padding:20px 34px;font-size:clamp(28px,5vw,48px);text-align:center;font-weight:bold;animation:pop .5s ease-out;box-shadow:0 10px 0 rgba(0,0,0,.15)}#yay small{font-size:.6em}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:24;border-radius:3px;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.heart{position:absolute;left:50%;top:-10px;font-size:26px;pointer-events:none;animation:hrt 2s ease-out infinite}@keyframes hrt{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-40px);opacity:0}}
.cr.sad{filter:saturate(.55) brightness(.85)}.cr.happy:not(.avt)>svg{animation:hop .6s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-8px)}}
@media (max-width:600px){#bar button,#bar select{font-size:16px;min-height:46px;padding:6px 12px}#bar{gap:7px}}
</style></head><body>
<div id="sea"><div id="sand"></div></div>
<div id="title"><div class="t1">🌊 Yusra's Diorama</div><div class="t2">Teacher: Ms. Wendy</div></div>
<button id="tchr" aria-label="Teacher">🔒</button>
<div id="bar">
<button id="swim">📷 Become a sea creature!</button>
<select id="pick" aria-label="Creature"></select><button id="add">➕ Add</button>
<select id="sel" aria-label="Find a swimmer"></select>
<button id="rm">🧹 Remove all</button><button id="reset">🔄 Reset</button><button id="collb">📚 Collection</button><button id="snap">📸 Snapshot</button><button id="pollb" style="background:#adb5bd">🗑️ Human Pollution</button><button id="cleanb" style="background:#06d6a0">🚤 Ocean Cleanup</button>
</div>
<button id="menub" aria-label="Menu" aria-expanded="false">🫧<span>Menu</span></button>
<div class="ov" id="info"><div class="card" id="infoc"></div></div>
<div class="ov" id="cam"><div class="card"><h2>Say cheese! 😁</h2>
<div id="camv"><video id="vid" autoplay playsinline muted></video><br><button id="shoot">📸 Take photo</button></div>
<div id="camp" style="display:none"><canvas id="prev" width="240" height="240"></canvas><br>
<h3 style="margin:6px">Pick your sea creature!</h3><div class="grid" id="avgrid"></div><div class="opts" id="cols"></div>
<input id="nm" maxlength="14" placeholder="Your name (optional)"><br><button id="join">🐠 Jump in!</button><button id="retake">↩️ Try again</button></div>
<p id="camerr" style="display:none;text-align:center"></p><button id="camx">❌ Close</button></div></div>
<div class="ov" id="tov"><div class="card"><h2>Teacher</h2><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><br>
<button id="clr">🗑️ Clear all selfies</button><button id="clrr">🧽 Clear researched fish</button><button id="tx">Close</button></div></div>
<div class="ov" id="coll"><div class="card"><h2>📚 Sea Creature Collection</h2>
<div class="rbox"><input id="rq" placeholder="🔬 Research any fish… (e.g. manta ray)" maxlength="40" autocomplete="off"><button id="rgo">🔎 Research</button><p id="rmsg"></p></div>
<div class="grid" id="tiles"></div><button id="collx">Close</button></div></div>
<div id="toast"></div>
<script src="app.js"></script><script src="pollution.js"></script></body></html>
